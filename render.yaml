# Blueprint Render — https://render.com/deploy?repo=https://github.com/Sezepmi/ch14-ocr
# Tras el deploy, la URL base será https://ch14-ocr.onrender.com (nombre del servicio).

services:
  - type: web
    name: ch14-ocr
    runtime: docker
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: OCR_ENGINE
        value: easyocr
      - key: OCR_GPU
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
